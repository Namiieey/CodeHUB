.cslot i{position:absolute;inset:0;background:var(--b);transform:scale(0);transition:transform .3s cubic-bezier(.34,1.5,.64,1);border-radius:inherit}
.cslot.on i{transform:scale(1)}.cslot b{position:relative;font-size:26px;color:#0b0b0c;font-weight:700;transform:translateY(8px);opacity:0;transition:.3s}.cslot.on b{transform:none;opacity:1}
.cslot.act:not(.on){background:#2a2a2f;box-shadow:inset 0 0 0 1.5px #7cc4ff55}
.cs[data-s=error] .cslot{background:#3a1a1c}.cs[data-s=error] i{background:var(--no)}.cs[data-s=error]{animation:shake .4s}

.slh.drag{transition:none;cursor:grabbing}.slh.spin svg{animation:rot 1s linear infinite}.slh.done{background:var(--ok);display:flex;justify-content:center;gap:6px}.slh.err{background:var(--no);color:#fff}

 <input class="in" id="cid" style="width:100%" placeholder="Spotify Client ID" value="${esc(SP.id)}"><p class="mu" style="font-size:12px;margin-top:8px"><b>Since March 2026</b> Spotify only lets Web API / Playback SDK apps work if the <b>app owner has Premium</b> (other users go under User Management). On a Free account, skip Connect and use the 🎵 embedded player — play/pause works from this bar.</p>
 <div class="ft"><button class="btn" id="cx">Cancel</button><button class="btn" id="cu">Copy redirect URI</button><button class="btn pri" id="go">Connect</button></div>`);
 $('#cx',o).onclick=()=>o.remove();$('#cu',o).onclick=()=>navigator.clipboard.writeText(spRed()).then(()=>toast('Redirect URI copied'));
 $('#go',o).onclick=()=>{const v=$('#cid',o).value.trim();if(!v)return toast('Enter your Client ID');if(file)return toast('Open the app via http://127.0.0.1 first');SP.id=v;try{localStorage.setItem('codehub.spid',v)}catch{}spLogin()}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-sp]'),id=e.target.id;if(id=='spc')return spSetup();if(id=='spet')return spEmb();if(id=='lfs')return lfSetup();if(id=='spep'&&SP.ec)return SP.ec.togglePlay();
 if(id=='spx'){localStorage.removeItem('codehub.sptok');clearTimeout(spT);SP.prem=null;return spDraw(null)}
 try{if(id=='sph'){SP.pl&&SP.pl.activateElement&&SP.pl.activateElement();await spApi('','PUT',JSON.stringify({device_ids:[SP.dev],play:true}));setTimeout(spPoll,600)}
  else if(b){const a=b.dataset.sp;await spApi('/'+a,a=='play'||a=='pause'?'PUT':'POST');setTimeout(spPoll,500)}}catch(err){if(/premium/i.test(err.message)){SP.prem=false;spDraw(SP.last)}toast(err.message)}});
const streak=()=>{const ds=new Set([...P,INBOX].flatMap(p=>tk(p)).filter(t=>t.d&&t.at).map(t=>new Date(t.at).toDateString()));let n=0,d=Date.now();if(!ds.has(new Date(d).toDateString()))d-=864e5;while(ds.has(new Date(d).toDateString())){n++;d-=864e5}return n};
function quick(){const o=modal('<h2>Quick capture</h2><input class="in" id="qc" style="width:100%" placeholder="Task for Inbox… (Enter)">');const i=$('#qc',o);i.focus();i.onkeydown=e=>{if(e.key=='Enter'&&i.value.trim()){tk(INBOX).push({id:uid(),t:i.value.trim(),d:false,due:'',pr:'Medium'});save();o.remove();toast('Added to Inbox');if(V.tab=='task'||V.tab=='dash')render()}}}
function notesView(){const a=N.filter(n=>!V.nq||(n.title+n.body).toLowerCase().includes(V.nq.toLowerCase())).sort((x,y)=>(y.pin?1:0)-(x.pin?1:0)||y.updated-x.updated);
 return`<h2>Notes</h2><div class="tool"><input class="in" id="nq" placeholder="Search notes…" value="${esc(V.nq||'')}"><button class="btn pri" id="nadd">${I.plus} New note</button></div><div class="cards">${a.map(n=>`<article class="card" data-nid="${n.id}"><div class="ch"><h3>${esc(n.title||'Untitled')}</h3><button class="ic ${n.pin?'pinned':''}" data-n="pin">${I.pin}</button></div><p class="d" style="-webkit-line-clamp:6;white-space:pre-wrap">${esc(n.body)}</p><div class="meta"><span>${esc((P.find(p=>p.id==n.pid)||{}).name||'General')}</span><span>${rel(n.updated)}</span></div><div class="acts"><button class="btn" data-n="edit">${I.edit} Edit</button><button class="ic" data-n="del">${I.trash}</button></div></article>`).join('')||'<div class="none">No notes yet. Click “New note”.</div>'}</div>`}
function wireX(){if(V.tab=='task'){const add=()=>{const v=$('#tn').value.trim(),p=PX($('#tp').value);if(!v)return toast('Type a task first');if(!p)return toast('Pick a project');V.tp=p.id;tk(p).push({id:uid(),t:v,d:false,due:$('#td').value,pr:$('#tpr').value});p.updated=Date.now();save();render();$('#tn').focus();toast('Task added to '+p.name)};$('#tadd').onclick=add;$('#tn').onkeydown=e=>{if(e.key=='Enter')add()};$('#tflt').onclick=()=>{V.tf=V.tf=='all'?'open':'all';render()}}
 if(V.tab=='note'){$('#nadd').onclick=()=>noteForm();const q=$('#nq');q.oninput=()=>{V.nq=q.value;const c=q.selectionStart;render();const n=$('#nq');n.focus();n.setSelectionRange(c,c)}}}
const go=t=>{V.tab=t;$$('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t==t));render()};
function palette(){const nm={dash:'Dashboard',proj:'Projects',task:'Tasks',note:'Notes',stat:'Analytics'};const items=[...Object.keys(nm).map(t=>({l:'Go to '+nm[t],f:()=>go(t)})),{l:'New project',f:()=>form()},{l:'New note',f:()=>noteForm()},...P.map(p=>({l:'Project: '+p.name,f:()=>details(p)})),...N.map(n=>({l:'Note: '+(n.title||'Untitled'),f:()=>noteForm(n)})),...[INBOX,...P].flatMap(p=>tk(p).filter(t=>!t.d).map(t=>({l:'Task: '+t.t+' · '+p.name,f:()=>go('task')})))];
 const o=modal(`<input class="in" id="pq" placeholder="Type a command, project, task or note…" style="width:100%"><div class="tl" id="pl" style="margin-top:10px;padding:0"></div>`);let sel=0,cur=[];
 const draw=()=>{const q=$('#pq',o).value.toLowerCase();cur=items.filter(i=>i.l.toLowerCase().includes(q)).slice(0,8);sel=Math.min(sel,Math.max(cur.length-1,0));$('#pl',o).innerHTML=cur.map((i,k)=>`<div class="pi ${k==sel?'on':''}" data-k="${k}">${esc(i.l)}</div>`).join('')||'<div class="pi">No matches</div>'};
 const run=k=>{const i=cur[k];if(i){o.remove();i.f()}};const q=$('#pq',o);
 q.oninput=()=>{sel=0;draw()};q.onkeydown=e=>{if(e.key=='ArrowDown'){sel=Math.min(sel+1,cur.length-1);draw();e.preventDefault()}else if(e.key=='ArrowUp'){sel=Math.max(sel-1,0);draw();e.preventDefault()}else if(e.key=='Enter')run(sel)};
 $('#pl',o).onclick=e=>{const d=e.target.closest('[data-k]');if(d)run(+d.dataset.k)};draw();q.focus()}
const FT={left:1500,on:false,iv:0,done:(()=>{try{return +localStorage.getItem('codehub.ft'+td())||0}catch{return 0}})()},tfmt=()=>String(Math.floor(FT.left/60)).padStart(2,'0')+':'+String(FT.left%60).padStart(2,'0'),T0='CodeHUB by Namith';
document.addEventListener('click',e=>{if(e.target.id=='fts'){FT.on=!FT.on;clearInterval(FT.iv);if(FT.on)FT.iv=setInterval(()=>{FT.left--;const el=$('#ft');if(el)el.textContent=tfmt();document.title=tfmt()+' · CodeHUB';if(FT.left<=0){clearInterval(FT.iv);FT.on=false;FT.left=1500;FT.done++;try{localStorage.setItem('codehub.ft'+td(),FT.done)}catch{}toast('Focus session complete 🎉');document.title=T0;render()}},1000);render()}
 else if(e.target.id=='ftr'){clearInterval(FT.iv);FT.on=false;FT.left=1500;document.title=T0;render()}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='k'&&!$('#app').classList.contains('hide')){e.preventDefault();if(!$('#pq'))palette()}});
$('#pal').onclick=palette;
document.body.classList.toggle('min',localStorage.getItem('codehub.min')!='0');$('#mn').onclick=()=>{const m=document.body.classList.toggle('min');try{localStorage.setItem('codehub.min',m?1:0)}catch{}};
function noteAct(b){const n=N.find(x=>x.id==b.closest('[data-nid]').dataset.nid);if(!n)return;const a=b.dataset.n;
 if(a=='pin'){n.pin=!n.pin;saveN();render()}else if(a=='edit')noteForm(n);else if(confirm('Delete this note?')){N=N.filter(x=>x!=n);saveN();render()}}
function noteForm(n){const nw=!n;n=n||{id:uid(),title:'',body:'',pid:'',pin:false};const o=modal(`<h2>${nw?'New':'Edit'} note</h2><div class="fm"><label class="w">Title<input id="nt1" value="${esc(n.title)}"></label><label class="w">Project<select id="np"><option value="">General</option>${P.map(p=>`<option value="${p.id}" ${p.id==n.pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label class="w">Note<textarea id="nb" style="min-height:200px">${esc(n.body)}</textarea></label></div><div class="ft"><button class="btn" id="cx">Cancel</button><button class="btn pri" id="sv">Save</button></div>`);
 $('#cx',o).onclick=()=>o.remove();$('#sv',o).onclick=()=>{Object.assign(n,{title:$('#nt1',o).value.trim(),body:$('#nb',o).value,pid:$('#np',o).value,updated:Date.now()});if(!n.title&&!n.body)return o.remove();if(nw)N.unshift(n);saveN();o.remove();render()}}
function form(p){let ph=null;const n=!p;p=p||{name:'',desc:'',status:'Planning',priority:'Medium',progress:0,deadline:'',techs:[],tags:[],notes:'',path:'',folderName:''};
 const o=modal(`<h2>${n?'Add Project':'Edit Project'}</h2><div class="fm">
 <label class="w">Name<input id="f-n" value="${esc(p.name)}" placeholder="My awesome app"></label>
 <label class="w">Description<textarea id="f-d">${esc(p.desc)}</textarea></label>
 <label>Status<select id="f-s">${ST.map(s=>`<option ${s==p.status?'selected':''}>${s}</option>`).join('')}</select></label>
 <label>Priority<select id="f-p">${PR.map(s=>`<option ${s==p.priority?'selected':''}>${s}</option>`).join('')}</select></label>
 <label>Progress: <span id="pv">${p.progress}</span>%<input type="range" id="f-g" min="0" max="100" value="${p.progress}"></label>
 <label>Deadline<input type="date" id="f-dl" value="${p.deadline||''}"></label>
 <label>Technologies (comma separated)<input id="f-t" value="${esc(p.techs.join(', '))}" placeholder="React, Flutter"></label>
 <label>Tags (comma separated)<input id="f-tg" value="${esc(p.tags.join(', '))}" placeholder="client, robotics"></label>
 <label class="w">Notes<textarea id="f-nt">${esc(p.notes)}</textarea></label>
 <label class="w">Folder path (optional, for “Copy path” → Explorer)<input id="f-pa" value="${esc(p.path)}" placeholder="C:\\Users\\Namith\\Projects\\my-app"></label>
 <label class="w">Repository URL (optional)<input id="f-rp" value="${esc(p.repo||'')}" placeholder="https://github.com/NamithRN/..."></label>
 <div class="w"><button class="btn" id="f-f">${I.folder} Choose Project Folder</button> <span id="f-fn" class="d">${p.folderName?'Linked: '+esc(p.folderName):'No folder linked'}</span></div></div>
 <div class="ft"><button class="btn" id="cx">Cancel</button><button class="btn pri" id="sv">Save</button></div>`);
 $('#cx',o).onclick=()=>o.remove();$('#f-g',o).oninput=e=>$('#pv',o).textContent=e.target.value;
 $('#f-f',o).onclick=async()=>{const h=await pick();if(h){ph=h;$('#f-fn',o).textContent='Linked: '+h.name}};
 $('#sv',o).onclick=async()=>{const name=$('#f-n',o).value.trim();if(!name)return toast('Project name is required');
  const l=s=>$(s,o).value.split(',').map(x=>x.trim()).filter(Boolean),now=Date.now();
  Object.assign(p,{name,desc:$('#f-d',o).value.trim(),status:$('#f-s',o).value,priority:$('#f-p',o).value,progress:+$('#f-g',o).value,deadline:$('#f-dl',o).value,techs:l('#f-t'),tags:l('#f-tg'),notes:$('#f-nt',o).value,path:$('#f-pa',o).value.trim(),repo:(v=>/^https?:\/\//.test(v)?v:'')($('#f-rp',o).value.trim()),updated:now});
  if(p.status=='Completed'&&p.progress<100&&confirm('Status is Completed. Set progress to 100%?'))p.progress=100;
  if(n){Object.assign(p,{id:uid(),created:now,opened:null,pinned:false});P.unshift(p)}
  if(ph){await idb('put',p.id,ph);p.folderName=ph.name}
  save();o.remove();render();toast(n?'Project added':'Project updated')}}
if(sessionStorage.getItem('codehub.ok'))enter();
</script></body></html>
